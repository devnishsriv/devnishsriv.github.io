<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: white;
            max-width: 500px;
            width: 100%;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .profile-image {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #4f46e5;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 10px;
            color: #111827;
        }

        p {
            color: #6b7280;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .button:hover {
            background: #3730a3;
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="your-photo.jpg" alt="Profile Photo" class="profile-image">

        <h1>Your Name</h1>

        <p>
            Welcome to my GitHub Pages website.
            This is a simple test page where I can experiment with HTML and CSS.
        </p>

        <a href="https://github.com/yourusername" class="button">
            Visit My GitHub
        </a>
    </div>

</body>
</html>
